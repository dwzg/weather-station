; Balcony weather station firmware (ESP8266, Wemos D1 mini).
;   pio test -e native          host unit tests for the logic in lib/core
;   pio run -e station          build
;   pio run -e station -t upload               first flash over USB
;   pio run -e ota -t upload                   update over Wi-Fi (needs OTA_PASSWORD in the environment)

[platformio]
default_envs = station

[env:station]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
extra_scripts = pre:tools/version.py
build_flags =
  -Wall
  -Wextra
  -DNDEBUG
lib_deps =
  adafruit/Adafruit BME280 Library@2.3.0
  adafruit/Adafruit Unified Sensor@1.1.15
  adafruit/Adafruit BusIO@1.17.4

[env:ota]
extends = env:station
upload_protocol = espota
upload_port = 192.168.178.57
upload_flags =
  --auth=${sysenv.OTA_PASSWORD}
  --port=8266

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DUNITY_INCLUDE_DOUBLE
