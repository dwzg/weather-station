[build]
target = "xtensa-esp32s2-espidf"

[target.xtensa-esp32s2-espidf]
linker = "ldproxy"
# The bootloader esp-idf-sys builds has app rollback enabled (sdkconfig.defaults);
# espflash's built-in one may not. Use with `cargo run --release`.
runner = "espflash flash --monitor --partition-table partitions.csv --bootloader target/xtensa-esp32s2-espidf/release/build/bootloader.bin"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s2"
ESP_IDF_VERSION = "v5.5.5"
# Keep ESP-IDF and its tools in ~/.espressif, shared between checkouts, instead of in .embuild/.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
