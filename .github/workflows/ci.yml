name: CI
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo test
        working-directory: core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - run: python3 tools/ota.py --self-test | grep -q 582918a97d97d3d3c90c3078b02e5bc955296f0c82e56ff00f4a07148f3011b4

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s2
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-v5.5.5-esp32s2-${{ hashFiles('firmware/sdkconfig.defaults') }}
      - run: cargo build --release
        working-directory: firmware
        env:
          WS_EXAMPLE_SECRETS: "1" # no real credentials in CI
